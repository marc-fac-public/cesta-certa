name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-e-testes:
    name: Build e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Configurar Node.js (versão do .nvmrc)
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências exatas
        run: npm ci

      - name: Executar testes unitários e de integração com cobertura
        run: npm run test:coverage

      - name: Gerar build de produção
        run: npm run build

      - name: Verificar vulnerabilidades altas ou críticas
        run: npm audit --audit-level=high --omit=dev
